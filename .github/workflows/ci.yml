name: Build and Deploy Wisecow

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            orionpax217/wisecow:${{ steps.vars.outputs.sha_short }}
            orionpax217/wisecow:latest

  deploy:
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/wisecow-app \
            wisecow-app=orionpax217/wisecow:${{ steps.vars.outputs.sha_short }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/wisecow-app
